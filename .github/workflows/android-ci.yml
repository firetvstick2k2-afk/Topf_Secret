name: Android CI

on:
  # Builds werden bewusst manuell über "Run workflow" gestartet.
  # Pull Requests gegen development werden weiterhin automatisch geprüft.
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub Actions secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/topf-secret-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/topf-secret-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify bundled BLS asset inside APK
        run: |
          APK_SOURCE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_SOURCE" ]; then
            echo "::error::No release APK was produced"
            exit 1
          fi
          if ! unzip -Z1 "$APK_SOURCE" | grep -Fxq "assets/bls_foods_v4.jsonl"; then
            echo "::error::BLS asset is missing from the generated APK"
            unzip -Z1 "$APK_SOURCE" | grep 'assets/' || true
            exit 1
          fi
          APK_ASSET="$RUNNER_TEMP/bls_foods_v4.jsonl"
          unzip -p "$APK_SOURCE" assets/bls_foods_v4.jsonl > "$APK_ASSET"
          if gzip -t "$APK_ASSET" 2>/dev/null; then
            APK_ASSET_SHA="$(gzip -dc "$APK_ASSET" | sha256sum | awk '{print $1}')"
          else
            APK_ASSET_SHA="$(sha256sum "$APK_ASSET" | awk '{print $1}')"
          fi
          EXPECTED_SHA="b58c764620ab5b3b28f81aa3d7caca23b4b2665b151642fde809fca25f4890a6"
          if [ "$APK_ASSET_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::BLS JSONL content checksum mismatch inside APK: $APK_ASSET_SHA"
            exit 1
          fi
          echo "Verified BLS JSONL content in APK (SHA-256: $APK_ASSET_SHA)"
          
      - name: Rename APK with build number
        run: |
          APK_SOURCE="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_SOURCE" ]; then
            echo "::error::No release APK was produced"
            exit 1
          fi
          APK_NAME="topf_secret_#${GITHUB_RUN_NUMBER}.apk"
          APK_PATH="app/build/outputs/apk/release/$APK_NAME"
          mv "$APK_SOURCE" "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "Created $APK_NAME"

      - name: Publish APK as direct GitHub Release download
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Topf Secret v0.7.0 – Build #${{ github.run_number }}
          body: |
            **App-Version:** 0.7.0 (versionCode 12)

            **Build:** #${{ github.run_number }}

            **Commit:** `${{ github.sha }}`

            Installierbare APK für Topf Secret. Die Änderungen dieses Builds sind im Commit und in der Projektdokumentation auf `development` nachvollziehbar.
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: true
