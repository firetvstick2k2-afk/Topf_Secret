name: Android CI

on:
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed Admin and Customer APKs
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub Actions secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/topf-secret-release.jks"

      - name: Build both signed release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/topf-secret-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon testAdminReleaseUnitTest testCustomerReleaseUnitTest assembleAdminRelease assembleCustomerRelease

      - name: Verify bundled BLS asset in both APKs
        run: |
          for APK_SOURCE in app/build/outputs/apk/admin/release/*.apk app/build/outputs/apk/customer/release/*.apk; do
            if [ ! -f "$APK_SOURCE" ]; then
              echo "::error::Expected APK missing: $APK_SOURCE"
              exit 1
            fi
            if ! unzip -Z1 "$APK_SOURCE" | grep -Fxq "assets/bls_foods_v4.jsonl"; then
              echo "::error::BLS asset is missing from $APK_SOURCE"
              exit 1
            fi
            APK_ASSET="$RUNNER_TEMP/$(basename "$(dirname "$(dirname "$APK_SOURCE")")")-bls_foods_v4.jsonl"
            unzip -p "$APK_SOURCE" assets/bls_foods_v4.jsonl > "$APK_ASSET"
            if gzip -t "$APK_ASSET" 2>/dev/null; then
              APK_ASSET_SHA="$(gzip -dc "$APK_ASSET" | sha256sum | awk '{print $1}')"
            else
              APK_ASSET_SHA="$(sha256sum "$APK_ASSET" | awk '{print $1}')"
            fi
            EXPECTED_SHA="b58c764620ab5b3b28f81aa3d7caca23b4b2665b151642fde809fca25f4890a6"
            if [ "$APK_ASSET_SHA" != "$EXPECTED_SHA" ]; then
              echo "::error::BLS JSONL content checksum mismatch in $APK_SOURCE: $APK_ASSET_SHA"
              exit 1
            fi
            echo "Verified BLS JSONL content in $APK_SOURCE"
          done

      - name: Prepare named APK files
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/admin/release/*.apk release-apks/TopfSecret_ADMIN.apk
          cp app/build/outputs/apk/customer/release/*.apk release-apks/TopfSecret.apk

      - name: Publish both APKs as direct GitHub Release downloads
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Topf Secret 0.9.8 – Admin + Kunden-App – Build #${{ github.run_number }}
          body: |
            **App-Version:** 0.9.8 (versionCode 24)

            **Build:** #${{ github.run_number }}

            **Commit:** `${{ github.sha }}`

            Enthalten sind zwei getrennte Installationen:
            - `TopfSecret.apk`: Kunden-App, ausschließlich mit gültiger Licence-Studio-Seriennummer.
            - `TopfSecret_ADMIN.apk`: Admin-App, ausschließlich mit dem Admin-Key.

            Beide APKs stammen aus demselben Entwicklungsstand.
          files: |
            release-apks/TopfSecret.apk
            release-apks/TopfSecret_ADMIN.apk
          draft: false
          prerelease: true
